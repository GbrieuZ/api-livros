name: FastAPI - Basic Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fastapi-tests:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout do código
        uses: actions/checkout@v3

      - name: 🐍 Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: 🛠 Instalar Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 📦 Instalar dependências com Poetry
        run: poetry install --no-root --no-interaction

      - name: Rodar testes
        env:
          MEU_USUARIO: "admin"
          MINHA_SENHA: "admin"
        run: poetry run pytest

      - name: Construir imagem Docker
        run: docker build -t fastapi-app:latest .

      - name: Validar inicialização do container
        env:
          MEU_USUARIO: "admin"
          MINHA_SENHA: "admin"
        run: |
          set -euo pipefail

          container_name="fastapi-app-ci"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$container_name" \
            -p 8000:8000 \
            -e MEU_USUARIO="$MEU_USUARIO" \
            -e MINHA_SENHA="$MINHA_SENHA" \
            -e DATABASE_URL="sqlite:////tmp/livros-ci.db" \
            fastapi-app:latest

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/; then
              echo
              echo "API respondeu com sucesso."
              exit 0
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "A API não respondeu em até 60 segundos. Logs do container:"
              docker logs "$container_name"
              exit 1
            fi

            sleep 2
          done
